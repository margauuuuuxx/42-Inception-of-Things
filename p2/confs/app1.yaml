apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-html
  labels:
    app: app1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>app1</title></head>
    <body>
      <h1>Hello from app1</h1>
    </body>
    </html>

---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app1
  name: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  strategy: {}
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - image: nginx
        name: nginx
        ports:
        - containerPort: 80
        resources: {}
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html   # mounts only this one file, leaves the rest of nginx's default html dir untouched
      volumes:
      - name: html
        configMap:
          name: app1-html       # must match the ConfigMap's metadata.name above
status: {}

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: app1
  name: app1
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: app1
  type: ClusterIP
status:
  loadBalancer: {}
